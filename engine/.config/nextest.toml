# cargo-nextest settings for `scripts/validate-repo.mjs` and CI. (The tests that measure time or
# process-wide limits, and had to run one at a time, moved with the AVA1 library to its own
# repository: third_party/ava1.)
[profile.default]
# A hung test is a failure, not a stalled gate.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
